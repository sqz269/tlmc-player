# TEMPLATE ONLY -- contains no real credentials, and must not.
#
# The committed version of this file held a live Postgres password and Keycloak
# realm-admin credentials still set to admin/admin, on a publicly reachable realm.
# Anyone with read access to this repository could take over the realm and mint
# tokens for any user, which defeats every [Authorize] in the backend. Rotate all of
# these, and scrub them from git history.
#
# Fill in and apply out-of-band (never commit the result):
#   sed 's/REPLACE_ME/<value>/' secrets.example.yaml | kubectl apply -f -
# Better still, manage them with SealedSecrets / SOPS / external-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-postgres-credentials
  namespace: tlmc-player
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: REPLACE_ME
  POSTGRES_DB: keycloak
  POSTGRES_HOST: keycloak-pgsql-clusterip.tlmc-player.svc.cluster.local
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: tlmc-player
type: Opaque
stringData:
  KEYCLOAK_ADMIN: REPLACE_ME
  KEYCLOAK_ADMIN_PASSWORD: REPLACE_ME
