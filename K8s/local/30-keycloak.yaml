---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: tlmc-player
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          args: ["start", "--import-realm"]
          env:
            # Only consulted when the master realm has no admin yet; an
            # existing database keeps the admin it already has.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: KEYCLOAK_ADMIN
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_LOG_LEVEL
              value: INFO
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: keycloak-pgsql-clusterip.tlmc-player.svc.cluster.local
            - name: KC_DB_URL_DATABASE
              value: keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-pgsql-credentials
                  key: POSTGRES_PASSWORD
            # Keycloak always serves plain HTTP here; TLS, when there is any,
            # is terminated upstream. Behind the Cloudflare tunnel deploy.sh
            # sets "xforwarded" so Keycloak trusts cloudflared's
            # X-Forwarded-* headers; for a direct NodePort there is no proxy
            # and deploy.sh deletes this entry (an empty value is rejected).
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "__KC_PROXY_HEADERS__"
            # The issuer baked into tokens. Must be byte-identical to the
            # backend's Keycloak__RealmUrl minus the /realms/... suffix, and
            # must be reachable from both inside the cluster and wherever
            # clients live -- hence a node IP or the public tunnel hostname,
            # never a service DNS name. A full URL pins scheme, host and port,
            # so forwarded headers can't change it.
            - name: KC_HOSTNAME
              value: __KC_ISSUER_BASE__
            # The admin console lives on its own URL so it can stay off the
            # tunnel: cloudflared 404s /admin on the public hostname, and the
            # console is reached over tailscale through the NodePort instead.
            - name: KC_HOSTNAME_ADMIN
              value: __KC_ADMIN_URL__
          ports:
            - name: http
              containerPort: 8080
            # Health and metrics live here since Keycloak 25, not on 8080 --
            # which keeps them off the tunnel, since no Service exposes 9000.
            - name: management
              containerPort: 9000
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            # 21 -> 26 runs every intervening schema migration on first boot.
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-server-clusterip
  namespace: tlmc-player
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    # The committed manifest has targetPort 80 here, which matches nothing --
    # the container listens on 8080.
    - name: http-keycloak
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-server-nodeport
  namespace: tlmc-player
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - name: http-keycloak
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: __KC_NODEPORT__
