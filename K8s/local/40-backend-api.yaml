---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-thumbdata
  namespace: tlmc-player
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: tlmc-player
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      # The image runs as uid/gid 1654 (app); fsGroup makes the freshly
      # provisioned thumbnail volume writable by it.
      securityContext:
        fsGroup: 1654
      containers:
        - name: backend-api
          image: localhost:5000/tlmc-backend-api:local
          imagePullPolicy: Always
          env:
            # Staging, not Development: keeps the unauthenticated
            # InternalController write surface 404-gated. Also not Production,
            # which force-rewrites Request.Scheme to https and breaks
            # link generation on a plain-HTTP cluster.
            - name: ASPNETCORE_ENVIRONMENT
              value: Staging
            - name: ConnectionStrings__PostgreSql
              valueFrom:
                secretKeyRef:
                  name: backend-api-config
                  key: ConnectionStrings__PostgreSql
            - name: Keycloak__RealmUrl
              value: __KC_ISSUER_BASE__/realms/MusicPlayer
            # Only relaxed for a plain-HTTP local Keycloak, which OIDC
            # discovery would otherwise refuse outright. Behind the Cloudflare
            # tunnel the issuer is https:// and deploy.sh sets this back to
            # true.
            - name: Keycloak__RequireHttpsMetadata
              value: "__KC_REQUIRE_HTTPS__"
            # Deliberately on while the v6 API is being exercised: the document
            # does describe the api/internal write surface, but those routes 404
            # without the key. Turn back off once a real client exists.
            - name: Swagger__Enabled
              value: "true"
            # Subsonic facade (Docs/SUBSONIC.md). Auth is per-user API keys
            # minted via the Keycloak-authorized /api/user/api-keys endpoints,
            # so enabling it exposes nothing anonymous.
            - name: Subsonic__Enabled
              value: "true"
            # v6: rows hold storage keys, and these roots are what they resolve
            # against (StorageRootResolver). media_key and asset keys live in the
            # library root; generated thumbnails will land in the thumbnail root.
            - name: Storage__Roots__Library
              value: /mnt/tlmc/TLMC v6
            - name: Storage__Roots__Thumbnail
              value: /thumbdata
            # Shared secret for the api/internal write surface. Absent, those routes
            # 404 rather than being reachable unauthenticated.
            - name: Internal__ApiKey
              valueFrom:
                secretKeyRef:
                  name: backend-api-config
                  key: Internal__ApiKey
            # Search engine (15-meilisearch.yaml). Unset Url = search answers 503
            # while everything else runs; the master key doubles as the API key
            # because this backend is the engine's only client.
            - name: Meilisearch__Url
              value: http://meilisearch-clusterip.tlmc-player.svc.cluster.local:7700
            - name: Meilisearch__ApiKey
              valueFrom:
                secretKeyRef:
                  name: meilisearch-credentials
                  key: MEILI_MASTER_KEY
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: musicdata
              mountPath: /mnt/tlmc/TLMC v6/
              readOnly: true
            - name: thumbdata
              mountPath: /thumbdata/
          # v6 startup neither migrates nor backfills (schema comes from an
          # explicit `dotnet ef database update`), so this budget is slack; kept
          # generous because a cold image pull rides on it too.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
      volumes:
        - name: musicdata
          hostPath:
            path: /mnt/tlmc/TLMC v6/
            type: Directory
        - name: thumbdata
          persistentVolumeClaim:
            claimName: backend-thumbdata
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-clusterip
  namespace: tlmc-player
spec:
  type: ClusterIP
  selector:
    app: backend-api
  ports:
    - name: http-backend-api
      protocol: TCP
      port: 80
      targetPort: 8080
      appProtocol: HTTP
---
# There is no ingress controller on this cluster, so the API is reached by
# NodePort rather than through K8s/ingress.yaml.
apiVersion: v1
kind: Service
metadata:
  name: backend-api-nodeport
  namespace: tlmc-player
spec:
  type: NodePort
  selector:
    app: backend-api
  ports:
    - name: http-backend-api
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30081
