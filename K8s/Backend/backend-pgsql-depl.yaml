apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-pgsql-depl
  namespace: tlmc-player
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-pgsql-depl

  template:
    metadata:
      labels:
        app: backend-pgsql-depl

    spec:
      containers:
        - name: backend-pgsql-depl
          # Pinned: halfvec needs pgvector >= 0.7, so the floating :pg15 tag is not
          # safe to depend on for the EmbeddingHalfvecAndHnsw migration.
          image: pgvector/pgvector:0.8.6-pg15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: postgrespw

          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgredb

      volumes:
        - name: postgredb
          persistentVolumeClaim:
            claimName: backend-pgsql-pv-claim
